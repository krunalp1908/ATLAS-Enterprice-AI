name: Atlas Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and check dependencies
        run: python -m pip install -r requirements.txt pytest ruff

      - name: Compile Python sources
        run: python -m compileall -q app worker

      - name: Lint Python
        run: ruff check app worker test --exclude test/Bedrock_test.py --select E4,E7,E9,F --ignore E701,E702,F401

      - name: Run unit tests
        run: python -m pytest -q test --ignore=test/Bedrock_test.py

  build-and-push:
    name: Build and push to ECR
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate build settings
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$AWS_REGION" || -z "$ECR_REPOSITORY" || -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Set AWS_REGION and ECR_REPOSITORY variables and the AWS_ROLE_ARN secret."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -Eeuo pipefail
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --tag "$image" \
            --push \
            .

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, atlas-ec2]
    environment: production
    timeout-minutes: 20
    permissions:
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
      APP_PORT: ${{ vars.APP_PORT || '8000' }}
      CONTAINER_NAME: atlas-enterprise-ai
      BEDROCK_EMBED_MODEL: ${{ vars.BEDROCK_EMBED_MODEL || 'amazon.titan-embed-text-v2:0' }}
      BEDROCK_CHAT_MODEL: ${{ vars.BEDROCK_CHAT_MODEL || 'amazon.nova-lite-v1:0' }}
      EMBED_DIM: ${{ vars.EMBED_DIM || '1024' }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || 'atlas-enterprise-ai-index' }}
      PINECONE_CLOUD: ${{ vars.PINECONE_CLOUD || 'aws' }}
      PINECONE_REGION: ${{ vars.PINECONE_REGION || 'us-east-1' }}
      PINECONE_READY_TIMEOUT: ${{ vars.PINECONE_READY_TIMEOUT || '180' }}
      MIN_RELEVANCE: ${{ vars.MIN_RELEVANCE || '0.25' }}
      HITL_ENABLED: ${{ vars.HITL_ENABLED || 'true' }}
      MEMORY_TURNS: ${{ vars.MEMORY_TURNS || '6' }}
      RIUS_SERVICE_NAME: ${{ vars.RIUS_SERVICE_NAME || 'atlas-ai-fde' }}
      RIUS_DISABLED: ${{ vars.RIUS_DISABLED || 'true' }}
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          set -Eeuo pipefail
          for name in AWS_REGION ECR_REPOSITORY AWS_ROLE_ARN S3_BUCKET DATABASE_URL PINECONE_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required deployment configuration is missing: ${name}."
              exit 1
            fi
          done
          if [[ ! "$APP_PORT" =~ ^[0-9]+$ ]] || (( APP_PORT < 1 || APP_PORT > 65535 )); then
            echo "::error::APP_PORT must be a port number from 1 to 65535."
            exit 1
          fi
          command -v docker >/dev/null
          docker info >/dev/null

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and deploy image with rollback
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
        run: |
          set -Eeuo pipefail

          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          candidate="${CONTAINER_NAME}-candidate-${GITHUB_RUN_ID}"
          previous="${CONTAINER_NAME}-previous-${GITHUB_RUN_ID}"
          docker pull "$image"

          rollback() {
            status=$?
            if (( status != 0 )); then
              docker rm --force "$candidate" >/dev/null 2>&1 || true
              if docker container inspect "$previous" >/dev/null 2>&1; then
                docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
                docker rename "$previous" "$CONTAINER_NAME" || true
                docker start "$CONTAINER_NAME" || true
              elif docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
                running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")"
                if [[ "$running" != "true" ]]; then
                  docker start "$CONTAINER_NAME" || true
                fi
              fi
            fi
          }
          trap rollback EXIT

          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")"
            if [[ "$running" == "true" ]]; then
              docker stop "$CONTAINER_NAME"
            fi
            docker rename "$CONTAINER_NAME" "$previous"
          fi

          docker run --detach \
            --name "$candidate" \
            --restart unless-stopped \
            --publish "${APP_PORT}:8000" \
            --env "AWS_REGION=${AWS_REGION}" \
            --env "AWS_DEFAULT_REGION=${AWS_REGION}" \
            --env S3_BUCKET \
            --env DATABASE_URL \
            --env PINECONE_API_KEY \
            --env BEDROCK_EMBED_MODEL \
            --env BEDROCK_CHAT_MODEL \
            --env EMBED_DIM \
            --env PINECONE_INDEX_NAME \
            --env PINECONE_CLOUD \
            --env PINECONE_REGION \
            --env PINECONE_READY_TIMEOUT \
            --env MIN_RELEVANCE \
            --env HITL_ENABLED \
            --env MEMORY_TURNS \
            --env RIUS_API_KEY \
            --env RIUS_SERVICE_NAME \
            --env RIUS_DISABLED \
            "$image"

          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health/ready" >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != "true" ]]; then
            docker logs --tail=100 "$candidate" || true
            echo "::error::New container failed its health check; restoring the previous container."
            exit 1
          fi

          docker rename "$candidate" "$CONTAINER_NAME"
          docker rm "$previous" 2>/dev/null || true
          trap - EXIT

          
          echo "Deployed ${image} successfully."
